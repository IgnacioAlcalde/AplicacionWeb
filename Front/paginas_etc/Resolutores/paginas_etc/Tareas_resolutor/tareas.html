<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Proyectos</title>
    <!-- Enlace a Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Enlace a tu archivo CSS externo -->
    <link rel="stylesheet" href="tareas.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light sidebar">
            <a class="navbar-brand" href="#">URBAN SENSO</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item active">
                        <a class="nav-link" href="../../inicioresolutor_dashboard.html">Inicio</a>
                    </li>
    
                    <li class="nav-item"></li>
                        <a class="nav-link" href="../../../../inicio_sesion_recuperacion/inicioSesionCorreo.html">Cerrar Sesion</a>
                    </li>
                    
                </ul>
            </div>
        </nav>

    </header>

    <h2>Tareas resueltas</h2>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12 ">
                <form id="nuevaTareaForm">
                    <label for="nombreTarea">Nueva tarea:</label>
                    <input type="text" id="nombreTarea" name="nombreTarea">
                    <button type="submit">Agregar</button>
                </form>
            </div>
        </div>
    </div>

    <table>
        <tr>
            <th>Nombre</th>
            <th>Estado</th>
            <th>Fecha de Inicio</th>
            <th>Fecha de Término</th>
        </tr>
    </table>
    
    <script>
        const proyectos = [
            { nombre: 'Tarea A', estado: 'Completada', inicio: '2023-10-20', fin: '2023-11-10' },
            { nombre: 'Tarea B', estado: 'Completada', inicio: '2023-09-10', fin: '2023-10-10' },
        ];

        // Función para crear una fila de la tabla
        function crearFila(proyecto) {
            const tabla = document.querySelector('table');
            const fila = tabla.insertRow();
            const celdaNombre = fila.insertCell();
            const celdaEstado = fila.insertCell();
            const celdaInicio = fila.insertCell();
            const celdaFin = fila.insertCell();
            
            celdaNombre.textContent = proyecto.nombre;
            celdaEstado.textContent = proyecto.estado;
            celdaInicio.textContent = proyecto.inicio;
            celdaFin.textContent = proyecto.fin;   
        }
        // Crear las filas de la tabla con los datos de los proyectos
        proyectos.forEach(crearFila);
        const nuevaTareaForm = document.getElementById('nuevaTareaForm');
        nuevaTareaForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const nombreTarea = document.getElementById('nombreTarea').value;
            const nuevaTarea = {
                nombre: nombreTarea,
                estado: 'Pendiente',
                inicio: new Date().toISOString().slice(0, 10),
                fin: '',
            };
            proyectos.push(nuevaTarea);     // Agregar la nueva tarea al array de proyectos
            crearFila(nuevaTarea);
            localStorage.setItem('proyectos', JSON.stringify(proyectos));
            nuevaTareaForm.reset();
        });

        // Recuperar proyectos de localStorage al cargar la página
        const proyectosGuardados = localStorage.getItem('proyectos');
        if (proyectosGuardados) {
        proyectos = JSON.parse(proyectosGuardados);
        proyectos.forEach(crearFila);
        }
    </script>
    <!-- Enlace a jQuery y Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
