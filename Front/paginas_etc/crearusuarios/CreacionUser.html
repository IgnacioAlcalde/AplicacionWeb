<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creación de usuarios</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="usuario.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light sidebar">
            <a class="navbar-brand" href="#">URBAN SENSO</a>
        </nav>
    </header>

    <div class="container mt-5">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title">Creación de usuarios</h2>
                <form>
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Ingresa el nombre del usuario">
                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellido:</label>
                        <input type="text" class="form-control" id="apellido" placeholder="Ingresa el apellido del usuario">
                    </div>
                    <div class="form-group">
                        <label for="correo">Correo:</label>
                        <input type="email" class="form-control" id="correo" placeholder="Ingresa el correo del usuario">
                    </div>
                    <div class="form-group">
                        <label for="rol">Rol:</label>
                        <select class="form-control" id="rol">
                            <option>Director de obras</option>
                            <option>Resolutor</option>
                            <option>Gestor territorial</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="estado">Estado:</label>
                        <select class="form-control" id="estado">
                            <option>Activo</option>
                            <option>Inactivo</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <button type="button" class="btn btn-primary" onclick="window.location.href='#'">Guardar usuario</button>
                        <button type="button" class="btn btn-secondary">Limpiar</button>
                        <button type="button" class="btn btn-danger " onclick="window.location.href='../../inicioadmin_dashboard.html'">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
