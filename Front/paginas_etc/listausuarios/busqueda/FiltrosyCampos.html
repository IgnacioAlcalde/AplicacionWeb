<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda Avanzada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="FiltrosyCamposCSS.css">
</head>


<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light sidebar">
            <a class="navbar-brand px-sm-3" href="../Listausuarios1.html">ATRAS</a>
        </nav>
    </header>

    <main role="main" class="col-md-9 col-lg-10 px-4">
        <h1 class="text-center mb-4">Búsqueda Avanzada de Usuarios</h1>

       <!-- Filtros Predefinidos -->
        <div class="mb-4">
            <h5>Filtros Predefinidos:</h5>
            <button class="btn btn-custom me-2 mb-2" onclick="applyFilter('activos')">Usuarios Activos</button>
            <button class="btn btn-custom me-2 mb-2" onclick="applyFilter('inactivos')">Usuarios Inactivos</button>
            <button class="btn btn-custom me-2 mb-2" onclick="applyFilter('proyectoX')">Usuarios Asignados al Proyecto X</button>
        </div>

        <!-- Formulario de Búsqueda -->
        <form id="searchForm">
            <div class="row mb-3">
                <div class="col-md-6 mb-3">
                    <label for="nombre" class="form-label">Nombre del Usuario</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Ingresa el nombre">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Ingresa el email">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6 mb-3">
                    <label for="rol" class="form-label">Rol</label>
                    <select class="form-select" id="rol">
                        <option value="">Selecciona un rol</option>
                        <option value="admin">Administrador</option>
                        <option value="depa">Departamento</option>
                        <option value="terri">Gestor Territorial</option>
                        <option value="res">Resolutor</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="estado" class="form-label">Estado</label>
                    <select class="form-select" id="estado">
                        <option value="">Selecciona un estado</option>
                        <option value="activo">Activo</option>
                        <option value="inactivo">Inactivo</option>
                    </select>
                </div>
            </div>
            <!-- Botón de Buscar -->
            <button type="button" class="btn btn-custom" onclick="realTimeSearch()">Buscar</button>
        </form>

        <!-- Resultados de Búsqueda -->
        <div class="mt-5">
            <h5>Resultados de Búsqueda:</h5>
            <div id="resultados" class="border p-3 bg-light">
                <!-- Los resultados se mostrarán aquí en tiempo real -->
            </div>
        </div>
    </div>
</main>

<script>
    // Filtros predefinidos
    function applyFilter(filter) {
        // Aquí puedes implementar la lógica de filtrado
        document.getElementById('resultados').innerHTML = `Filtro aplicado: ${filter}`;
    }

    // Búsqueda en tiempo real
    function realTimeSearch() {
        // Aquí debes implementar la búsqueda en tiempo real (AJAX o similar)
        let nombre = document.getElementById('nombre').value;
        let email = document.getElementById('email').value;
        let rol = document.getElementById('rol').value;
        let estado = document.getElementById('estado').value;

        // Simulando la actualización de los resultados
        document.getElementById('resultados').innerHTML = `
            <p>Resultados para:</p>
            <ul>
                <li><strong>Nombre:</strong> ${nombre || 'No especificado'}</li>
                <li><strong>Email:</strong> ${email || 'No especificado'}</li>
                <li><strong>Rol:</strong> ${rol || 'No especificado'}</li>
                <li><strong>Estado:</strong> ${estado || 'No especificado'}</li>
                
            </ul>
            <div class="row botones-container">
                <div class="col-auto">
                    <button class="btn btn-primary">Ver</button>
                </div>
                <div class="col-auto">
                    <button class="btn btn-secondary">Editar</button>
                </div>
                <div class="col-auto">
                    <button class="btn btn-warning">Cambiar Contraseña</button>
                </div>
                <div class="col-auto">
                    <button class="btn btn-danger">Bloquear</button>
                </div>
           </div>
        `;
    }
</script>
</body>
</html>
