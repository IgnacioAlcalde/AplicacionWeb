                <input type="password" id="password" name="clave" placeholder="Contraseña" >

                <!-- <a href="../inicioadmin_dashboard.html" class="inicio_sesion">Iniciar sesión</a> -->
                <button type="submit" class="boton_iniciar inicio_sesion">Iniciar sesión</button>
                <center><a href="inicioSesionRut.html" class="rut_mensaje">Ingresar con rut</a></center>
            </form>
            <a href="olvide_contraseña.html" class="olv">Olvide mi contraseña</a>
        </div>
    </div>

    <script src="iniciar_sesion.js"></script>
