<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importación y Exportación de Usuarios</title>
    <!-- Enlace a Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Enlace a tu archivo CSS externo -->
    <link rel="stylesheet" href="ExpeImp_css.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light sidebar">
            <a class="navbar-brand" href="../../inicioadmin_dashboard.html">ATRAS</a>
        </nav>
    </header>

    <main role="main" class="col-md-9 ml-sm-auto col-lg-10 px-4">
        <h2>Importación y Exportación de Usuarios</h2>

        <div class="row">
            <!-- Formulario para importar usuarios -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        Importar Usuarios
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="form-group">
                                <label for="fileInput">Subir archivo CSV/EXCEL</label>
                                <input type="file" class="form-control-file" id="fileInput" accept=".csv, .xls, .xlsx">
                            </div>
                            <button type="submit" class="btn btn-primary">Importar</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Botón para exportar usuarios -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        Exportar Usuarios
                    </div>
                    <div class="card-body">
                        <button type="button" class="btn btn-success">Descargar Lista de Usuarios</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Enlace a jQuery y Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
