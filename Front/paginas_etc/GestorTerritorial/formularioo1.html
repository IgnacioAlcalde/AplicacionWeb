<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Incidencias</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="fromulariostil.css"> 
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light sidebar">
            <a class="navbar-brand" href="GestorTerrit1.html">ATRÁS</a>
            <div id="container">
                <h1>Formulario de Incidencias</h1>
            </div>
        </nav>
    </header>

    <form id="incidenciaForm">
        <label for="rut">RUT:</label>
        <input type="text" id="rut" name="rut" placeholder="Ej: 12345678-9" required>

        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" placeholder="Ej: usuario@gmail.com" required>

        <label for="TítuloIncidencia">Título Incidencia:</label>
        <input type="text" id="TítuloIncidencia" name="TítuloIncidencia" required>

        <label for="Localización">Localización:</label>
        <input type="text" id="Localización" name="Localización" required>

        <label for="Fecha">Fecha:</label>
        <input type="date" id="Fecha" name="Fecha" required>

        <label for="descripcion">Descripción de la incidencia:</label>
        <textarea id="descripcion" name="descripcion" required></textarea>

        <div class="form-group">
            <label for="fileInput">Subir archivo</label>
            <input type="file" class="form-control-file" id="fileInput" accept=".MP3, .MP4, .DOCX">
        </div>

        <div class="buttons">
            <button type="button" class="btn btn-primary" id="editButton">Editar Incidencia</button>
            <button type="button" class="btn btn-secondary" id="addButton">Añadir Nueva Incidencia</button>
            <button type="submit" class="btn btn-success" id="saveButton">Guardar Incidencia</button>
        </div>
    </form>

    <script>
        const form = document.getElementById('incidenciaForm');
        const editButton = document.getElementById('editButton');
        const addButton = document.getElementById('addButton');
        const saveButton = document.getElementById('saveButton');

        // Validar RUT
        function validarRUT(rut) {
            const regex = /^[0-9]+-[0-9Kk]$/;
            if (!regex.test(rut)) {
                return false;
            }
            
            const parts = rut.split('-');
            const cuerpo = parts[0];
            let dv = parts[1].toUpperCase();

            let suma = 0;
            let multiplo = 2;

            for (let i = cuerpo.length - 1; i >= 0; i--) {
                suma += multiplo * cuerpo.charAt(i);
                multiplo = (multiplo == 7) ? 2 : multiplo + 1;
            }

            const dvEsperado = 11 - (suma % 11);
            if (dvEsperado == 11) dvEsperado = '0';
            if (dvEsperado == 10) dvEsperado = 'K';

            return dv == dvEsperado;
        }

        // Validar Correo Electrónico
        function validarEmail(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }

        // Función para editar datos del formulario
        editButton.addEventListener('click', function() {
            document.getElementById('TítuloIncidencia').disabled = false;
            document.getElementById('Localización').disabled = false;
            document.getElementById('Fecha').disabled = false;
            document.getElementById('descripcion').disabled = false;
            document.getElementById('fileInput').disabled = false;
            document.getElementById('rut').disabled = false;
            document.getElementById('email').disabled = false;
        });

        // Función para añadir una nueva incidencia (limpiar el formulario)
        addButton.addEventListener('click', function() {
            form.reset();
            document.getElementById('TítuloIncidencia').disabled = false;
            document.getElementById('Localización').disabled = false;
            document.getElementById('Fecha').disabled = false;
            document.getElementById('descripcion').disabled = false;
            document.getElementById('fileInput').disabled = false;
            document.getElementById('rut').disabled = false;
            document.getElementById('email').disabled = false;
        });

        // Función para guardar o modificar los datos
        form.addEventListener('submit', function(event) {
            event.preventDefault(); // Evita el envío del formulario de manera predeterminada

            // Validar el formato del RUT antes de continuar
            const rutInput = document.getElementById('rut').value;
            if (!validarRUT(rutInput)) {
                alert('RUT inválido. Por favor ingrese un RUT válido.');
                return;
            }

            // Validar el formato del correo electrónico antes de continuar
            const emailInput = document.getElementById('email').value;
            if (!validarEmail(emailInput)) {
                alert('Correo electrónico inválido. Por favor ingrese un correo válido.');
                return;
            }

            alert('Incidencia guardada exitosamente.');
            
            // Luego de guardar, deshabilitar los campos
            document.getElementById('TítuloIncidencia').disabled = true;
            document.getElementById('Localización').disabled = true;
            document.getElementById('Fecha').disabled = true;
            document.getElementById('descripcion').disabled = true;
            document.getElementById('fileInput').disabled = true;
            document.getElementById('rut').disabled = true;
            document.getElementById('email').disabled = true;
        });
    </script>
</body>
</html>
