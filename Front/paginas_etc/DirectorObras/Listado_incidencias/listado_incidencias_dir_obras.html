    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Enlace a tu archivo CSS externo -->
    <link rel="stylesheet" href="lista_incidencias_dir_obra.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light sidebar">
            <a class="navbar-brand" href="#">URBAN SENSO</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item active">
                        <a class="nav-link" href="../iniciodireobra_dashboard.html">Inicio</a>

                    <li class="nav-item"></li>
                        <a class="nav-link" href="../../inicio_sesion_recuperacion/inicioSesionCorreo.html">Cerrar Sesion</a>
                    </li>
                    
                </ul>
            </div>
        </nav>
    </header>

    <h2>Lista de Proyectos Activos</h2>
    <table>
        <tr>
            <th>Nombre</th>
            <th>Estado</th>
            <th>Fecha de Inicio</th>
            <th>Fecha de Término</th>
            <th>Editar incidencia</th>
            <th>Asignación</th>
        </tr>
    </table>
    <script>
        const proyectos = [
            { nombre: 'Incidencia A', estado: 'En progreso', inicio: '2023-11-01' },
            { nombre: 'Incidencia B', estado: 'Completado', inicio: '2023-10-20', fin: '2023-11-10' },
            { nombre: 'Incidencia C', estado: 'Completado', inicio: '2023-09-10', fin: '2023-10-10' },
            { nombre: 'Incidencia D', estado: 'No Terminado', inicio: '2023-12-06' },
        ];

        // Función para crear una fila de la tabla
        function crearFila(proyecto, index) {
            const tabla = document.querySelector('table');
            const fila = tabla.insertRow();
            const celdaNombre = fila.insertCell();
            const celdaEstado = fila.insertCell();
            const celdaInicio = fila.insertCell();
            const celdaFin = fila.insertCell();
            const celdaEditar = fila.insertCell();
            const celdaAsignacion = fila.insertCell();

            celdaNombre.textContent = proyecto.nombre;
            celdaEstado.textContent = proyecto.estado;
            celdaInicio.textContent = proyecto.inicio;
            celdaFin.textContent = proyecto.fin || 'N/A';  // Mostrar 'N/A' si no hay fecha de fin

            // Crear el botón de "Editar"
            const botonEditar = document.createElement('button');
            botonEditar.textContent = 'Editar';
            botonEditar.classList.add('btn', 'btn-primary');  // Clases de Bootstrap para estilos
            botonEditar.onclick = function() {
                editarIncidencia(index);  // Llama a la función de edición con el índice del proyecto
            };

            celdaEditar.appendChild(botonEditar);  // Agregar el botón a la celda
            
            // Crear el menú desplegable
            const selectAsignacion = document.createElement('select');
            selectAsignacion.classList.add('form-select');
            const opcion1 = document.createElement('option');
            opcion1.value = '-Estado de Asignacion-';
            opcion1.textContent = '-Estado de Asignación-';
            const opcion2 = document.createElement('option');
            opcion2.value = 'opcion2';
            opcion2.textContent = 'No asignado';
            const opcion3 = document.createElement('option');
            opcion3.value = 'opcion3';
            opcion3.textContent = 'Asignado';
            selectAsignacion.appendChild(opcion1);
            selectAsignacion.appendChild(opcion2);
            selectAsignacion.appendChild(opcion3);
            celdaAsignacion.appendChild(selectAsignacion);

            // Agregar los textos con hipervínculo debajo del select
            const link1 = document.createElement('a');
            link1.href = 'direcobras_tareas.html';
            link1.textContent = 'Editar asignación';
            link1.classList.add('d-block', 'mt-2');
            celdaAsignacion.appendChild(link1);
            
        }

        

        // Función para manejar la edición
        function editarIncidencia(index) {
            alert('Editar incidencia: ' + proyectos[index].nombre);
            // Aquí podrías redirigir a una página de edición o abrir un formulario modal
        }



        // Crear las filas de la tabla con los datos de los proyectos
        proyectos.forEach(crearFila);
    </script>
     <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
     <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
